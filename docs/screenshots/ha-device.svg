<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1c71"/><stop offset="1" stop-color="#141A22"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0b0f14" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="420" height="480" fill="#f2f4f7"/>

  <!-- device header -->
  <g transform="translate(20,22)">
    <rect width="36" height="36" rx="9" fill="#0B0F14"/>
    <rect x="8" y="10" width="20" height="13" rx="2.5" fill="none" stroke="#F7F7F9" stroke-width="2"/>
    <path d="M18 15l5 3-5 3z" fill="#FF5252"/>
    <path d="M6 30q12 -9 24 0" fill="none" stroke="#4CC2FF" stroke-width="2"/>
    <text x="48" y="16" fill="#212121" font-size="17" font-weight="800">Bedroom TV</text>
    <text x="48" y="32" fill="#727272" font-size="12">Android TV HA Bridge · nz.mcnabb.atvhabridge</text>
  </g>

  <!-- media_player hero card -->
  <g filter="url(#sh)">
    <rect x="20" y="76" width="380" height="120" rx="14" fill="#ffffff"/>
  </g>
  <rect x="36" y="92" width="140" height="80" rx="8" fill="url(#thumb)"/>
  <text x="106" y="138" fill="#fff" font-size="11" opacity=".8" text-anchor="middle">MasterChef</text>
  <text x="192" y="110" fill="#212121" font-size="15" font-weight="700">MasterChef Australia</text>
  <text x="192" y="130" fill="#727272" font-size="12">TVNZ+ · S16 · E42</text>
  <rect x="192" y="142" width="192" height="4" rx="2" fill="#e6e8ec"/>
  <rect x="192" y="142" width="70" height="4" rx="2" fill="#FF5252"/>
  <text x="192" y="162" fill="#9aa0aa" font-size="10">20:41</text>
  <text x="384" y="162" fill="#9aa0aa" font-size="10" text-anchor="end">1:00:00</text>
  <circle cx="356" cy="112" r="15" fill="#FF5252"/>
  <path d="M351 105h3v14h-3z M359 105h3v14h-3z" fill="#fff"/>

  <!-- entity rows -->
  <g font-size="13">
    <!-- row template -->
    <g transform="translate(20,210)" filter="url(#sh)"><rect width="380" height="40" rx="10" fill="#fff"/></g>
    <text x="52" y="235" fill="#212121">Current app</text>
    <text x="384" y="235" fill="#5B6675" text-anchor="end" font-weight="600">TVNZ+</text>
    <circle cx="36" cy="230" r="9" fill="#eaf6ff"/><text x="36" y="234" font-size="11" text-anchor="middle">📺</text>

    <g transform="translate(20,258)" filter="url(#sh)"><rect width="380" height="40" rx="10" fill="#fff"/></g>
    <text x="52" y="283" fill="#212121">Up next</text>
    <text x="384" y="283" fill="#5B6675" text-anchor="end" font-weight="600">The Chase Australia</text>
    <circle cx="36" cy="278" r="9" fill="#eaf6ff"/><text x="36" y="282" font-size="11" text-anchor="middle">⏭</text>

    <g transform="translate(20,306)" filter="url(#sh)"><rect width="380" height="40" rx="10" fill="#fff"/></g>
    <text x="52" y="331" fill="#212121">Remote</text>
    <text x="384" y="331" fill="#5B6675" text-anchor="end" font-weight="600">On</text>
    <circle cx="36" cy="326" r="9" fill="#ffecec"/><text x="36" y="330" font-size="11" text-anchor="middle">🎛</text>

    <!-- diagnostics chips -->
    <g transform="translate(20,360)">
      <text x="0" y="0" fill="#727272" font-size="11" font-weight="600" letter-spacing="1">DIAGNOSTIC</text>
      <g filter="url(#sh)"><rect x="0" y="12" width="120" height="52" rx="10" fill="#fff"/></g>
      <text x="14" y="34" fill="#727272" font-size="11">Battery</text><text x="14" y="52" fill="#212121" font-size="15" font-weight="700">100%</text>
      <g filter="url(#sh)"><rect x="130" y="12" width="120" height="52" rx="10" fill="#fff"/></g>
      <text x="144" y="34" fill="#727272" font-size="11">Storage free</text><text x="144" y="52" fill="#212121" font-size="15" font-weight="700">12.3 GB</text>
      <g filter="url(#sh)"><rect x="260" y="12" width="120" height="52" rx="10" fill="#fff"/></g>
      <text x="274" y="34" fill="#727272" font-size="11">Wi-Fi signal</text><text x="274" y="52" fill="#212121" font-size="15" font-weight="700">−55 dBm</text>
    </g>
  </g>
</svg>
